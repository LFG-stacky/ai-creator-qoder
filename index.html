<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI CREATOR — 让每一个 AI 创意，成为价值</title>
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-gray: #f5f5f7;
      --bg-subtle: #e9e9ee;
      --bg-card: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.78);
      --bg-glass-strong: rgba(255, 255, 255, 0.92);
      --ink-primary: #1d1d1f;
      --ink-secondary: #6e6e73;
      --ink-tertiary: #86868b;
      --ink-inverse: #ffffff;
      --accent: #007aff;
      --accent-hover: #0066d6;
      --accent-soft: rgba(0, 122, 255, 0.09);
      --accent-ring: rgba(0, 122, 255, 0.24);
      --success: #248a3d;
      --success-dot: #34c759;
      --amber: #ff9500;
      --danger: #d70015;
      --heart: #ff2d55;
      --border-hairline: rgba(0, 0, 0, 0.06);
      --border-subtle: rgba(0, 0, 0, 0.1);
      --border-strong: rgba(0, 0, 0, 0.16);
      --hero-veil-top: #ffffff;
      --hero-veil-mid: rgba(255, 255, 255, 0.76);
      --hero-veil-low: rgba(255, 255, 255, 0.06);
      --hero-veil-end: rgba(245, 245, 247, 0.24);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Inter", sans-serif;
      --r-sm: 12px;
      --r-card: 20px;
      --r-bento: 24px;
      --r-pill: 999px;
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 10px 34px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 22px 58px rgba(0, 0, 0, 0.1), 0 4px 16px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 32px 88px rgba(0, 0, 0, 0.18), 0 6px 20px rgba(0, 0, 0, 0.08);
      --ease-apple: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --nav-h: 68px;
      --container-max: 1360px;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg-white: #0b0b0d;
      --bg-gray: #141417;
      --bg-subtle: #242429;
      --bg-card: #1c1c20;
      --bg-glass: rgba(18, 18, 22, 0.78);
      --bg-glass-strong: rgba(20, 20, 24, 0.92);
      --ink-primary: #f5f5f7;
      --ink-secondary: #a1a1a6;
      --ink-tertiary: #787880;
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --accent-soft: rgba(10, 132, 255, 0.16);
      --accent-ring: rgba(10, 132, 255, 0.32);
      --success: #30d158;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.13);
      --border-strong: rgba(255, 255, 255, 0.22);
      --hero-veil-top: #0b0b0d;
      --hero-veil-mid: rgba(11, 11, 13, 0.84);
      --hero-veil-low: rgba(11, 11, 13, 0.34);
      --hero-veil-end: rgba(20, 20, 23, 0.88);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.28);
      --shadow-md: 0 10px 32px rgba(0, 0, 0, 0.38);
      --shadow-lg: 0 22px 56px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg-white); -webkit-font-smoothing: antialiased; }
    body {
      margin: 0; min-width: 320px; font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
      color: var(--ink-primary); background: var(--bg-white); overflow-x: hidden;
      transition: background-color 320ms var(--ease-apple), color 320ms var(--ease-apple);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }
    a { color: var(--accent); text-decoration: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .ic { display: inline-block; flex: none; vertical-align: middle; transition: transform 240ms var(--ease-out), color 220ms var(--ease-apple); }
    .container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding-inline: 40px; }
    kbd {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px;
      background: var(--bg-gray); border: 1px solid var(--border-subtle);
      font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--ink-secondary);
    }

    /* Navigation */
    .apple-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: var(--nav-h);
      background: var(--bg-glass); backdrop-filter: saturate(180%) blur(22px); -webkit-backdrop-filter: saturate(180%) blur(22px);
      border-bottom: 1px solid transparent; transition: all 300ms var(--ease-apple);
    }
    .apple-nav.is-scrolled { background: var(--bg-glass-strong); border-bottom-color: var(--border-hairline); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05); }
    .nav-progress {
      position: absolute; left: 0; bottom: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), #5ac8fa); width: 0%; transition: width 90ms linear; pointer-events: none;
    }
    .nav-inner {
      height: 100%; max-width: var(--container-max); margin: 0 auto; padding-inline: 40px;
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
    }
    .brand { min-height: 44px; display: inline-flex; align-items: center; gap: 11px; border: 0; background: transparent; padding: 0 4px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(145deg, #2c2c2e, #121214); color: #fff;
      display: grid; place-items: center; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 280ms var(--ease-out);
    }
    :root[data-theme="dark"] .brand-mark { background: linear-gradient(145deg, #2c2c34, #1c1c22); border: 1px solid rgba(255,255,255,0.14); }
    .brand:hover .brand-mark { transform: rotate(12deg) scale(1.05); }
    .brand-wordmark { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      min-height: 40px; padding: 0 15px; border: 0; border-radius: var(--r-pill);
      background: transparent; font-size: 14px; font-weight: 500; color: var(--ink-secondary); white-space: nowrap;
      transition: all 220ms var(--ease-apple);
    }
    .nav-link:hover { color: var(--ink-primary); background: var(--accent-soft); }
    .nav-link.is-active { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      position: relative; min-width: 40px; min-height: 40px; padding: 0 10px; border: 0; border-radius: var(--r-pill);
      background: transparent; color: var(--ink-secondary);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 220ms var(--ease-apple);
    }
    .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .nav-search-trigger {
      background: var(--bg-gray); border: 1px solid var(--border-hairline);
      padding-inline: 14px; min-width: 165px; justify-content: space-between;
    }
    .nav-search-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-tertiary); }
    .avatar-trigger {
      position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-subtle);
      background: var(--bg-gray); color: var(--ink-primary); display: grid; place-items: center; transition: all 220ms var(--ease-apple);
    }
    .avatar-trigger:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-card); }
    .dot-badge {
      position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 99px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
      display: grid; place-items: center; border: 2px solid var(--bg-white);
    }

    /* Buttons */
    .btn-primary, .btn-secondary, .btn-glass, .btn-danger {
      min-height: 44px; padding: 0 22px; border-radius: var(--r-pill);
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 15px; font-weight: 500; white-space: nowrap;
      transition: transform 240ms var(--ease-out), background-color 220ms var(--ease-apple), box-shadow 240ms var(--ease-out), border-color 220ms var(--ease-apple);
    }
    .btn-lg { min-height: 52px; padding: 0 30px; font-size: 16px; }
    .btn-sm { min-height: 38px; padding: 0 16px; font-size: 13px; }
    .btn-primary { border: 1px solid transparent; background: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(0, 122, 255, 0.28); }
    .btn-primary:hover { background: var(--accent-hover); transform: scale(1.025); box-shadow: 0 8px 26px rgba(0, 122, 255, 0.36); }
    .btn-secondary { border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--ink-primary); box-shadow: var(--shadow-sm); }
    .btn-secondary:hover { background: var(--bg-gray); border-color: var(--border-strong); transform: scale(1.02); }
    .btn-glass { border: 1px solid var(--border-subtle); background: var(--bg-glass-strong); backdrop-filter: saturate(180%) blur(16px); color: var(--ink-primary); box-shadow: var(--shadow-sm); }
    .btn-glass:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.02); }
    .btn-danger { border: 1px solid transparent; background: var(--danger); color: #fff; }
    .full { width: 100%; }
    .link-cta {
      min-height: 40px; padding: 0 12px; border: 0; border-radius: var(--r-pill);
      background: transparent; color: var(--accent); font-size: 15px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px; transition: background-color 220ms var(--ease-apple);
    }
    .link-cta:hover { background: var(--accent-soft); }
    .link-cta:hover .ic { transform: translateX(2px); }

    /* Hero */
    .apple-hero {
      position: relative; width: 100%; min-height: min(94vh, 920px);
      background: var(--bg-white); display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; overflow: hidden;
      padding: calc(var(--nav-h) + 34px) 40px 64px;
    }
    .hero-media {
      position: absolute; left: 0; right: 0; bottom: 0; top: 18%;
      width: 100%; height: 82%; object-fit: cover; object-position: center 62%;
      pointer-events: none; transition: opacity 320ms var(--ease-apple);
    }
    :root[data-theme="dark"] .hero-media { opacity: 0.55; filter: saturate(1.1) contrast(1.06); }
    .hero-veil {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, var(--hero-veil-top) 0%, var(--hero-veil-top) 26%, var(--hero-veil-mid) 45%, var(--hero-veil-low) 64%, var(--hero-veil-end) 100%);
    }
    .hero-center {
      position: relative; z-index: 2; max-width: 880px; text-align: center;
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp 520ms var(--ease-out) both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .contest-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 12px;
      border-radius: var(--r-pill); background: var(--accent-soft); border: 1px solid rgba(0, 122, 255, 0.22);
      color: var(--accent); font-size: 12.5px; font-weight: 600; margin-bottom: 16px;
      transition: all 220ms var(--ease-apple);
    }
    .contest-pill:hover { background: var(--accent); color: #fff; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px;
    }
    .apple-hero h1 { margin: 0; font-size: clamp(44px, 5.4vw, 72px); font-weight: 700; line-height: 1.08; letter-spacing: -0.038em; }
    .hero-accent-text { background: linear-gradient(135deg, var(--ink-primary) 30%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-subtitle { margin: 20px 0 0; max-width: 650px; font-size: clamp(17px, 1.45vw, 20px); color: var(--ink-secondary); }
    .hero-cta-row { margin-top: 28px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 14px; }
    .hero-quick-tags { margin-top: 22px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
    .hero-tag-pill {
      min-height: 32px; padding: 0 13px; border-radius: var(--r-pill); border: 1px solid var(--border-hairline);
      background: var(--bg-glass-strong); backdrop-filter: blur(12px); font-size: 12px; font-weight: 500;
      color: var(--ink-secondary); display: inline-flex; align-items: center; gap: 5px; transition: all 200ms;
    }
    .hero-tag-pill:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .hero-scroll-cue {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2;
      min-height: 40px; padding: 0 18px; border: 1px solid var(--border-hairline); border-radius: var(--r-pill);
      background: var(--bg-glass-strong); backdrop-filter: blur(12px); color: var(--ink-secondary);
      font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
    }

    /* Bands & Shared */
    .band { padding: 96px 0; }
    .band-white { background: var(--bg-white); }
    .band-gray { background: var(--bg-gray); }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 44px; flex-wrap: wrap; }
    .section-head h2 { margin: 4px 0 0; font-size: clamp(30px, 3.2vw, 46px); font-weight: 700; line-height: 1.14; letter-spacing: -0.03em; }
    .section-head p { margin: 10px 0 0; max-width: 560px; font-size: 17px; color: var(--ink-secondary); }
    .sub-head { display: flex; align-items: center; justify-content: space-between; margin: 52px 0 22px; }
    .sub-head h3 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }

    .metrics-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; padding-bottom: 52px; border-bottom: 1px solid var(--border-hairline); }
    .metric-item strong { display: block; font-size: clamp(36px, 3.6vw, 52px); font-weight: 700; line-height: 1.06; letter-spacing: -0.035em; }
    .metric-item span { font-size: 15px; color: var(--ink-secondary); }

    .asymmetric-split { margin-top: 52px; display: grid; grid-template-columns: 5fr 7fr; gap: 48px; align-items: start; }
    .split-lead h2 { margin: 4px 0 14px; font-size: clamp(28px, 2.8vw, 40px); line-height: 1.16; letter-spacing: -0.03em; }
    .lead-copy { color: var(--ink-secondary); margin: 0 0 22px; }
    .cloud-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: var(--r-pill); background: var(--bg-gray); border: 1px solid var(--border-hairline); font-size: 13px; color: var(--ink-secondary); }
    .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--success-dot); display: inline-block; }
    .split-cards { display: grid; gap: 14px; }
    .step-card {
      width: 100%; text-align: left; padding: 22px 24px; border-radius: var(--r-card);
      border: 1px solid var(--border-hairline); background: var(--bg-gray);
      display: flex; align-items: center; gap: 18px; transition: all 260ms var(--ease-out);
    }
    .step-card:hover { background: var(--bg-card); border-color: var(--border-subtle); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .step-card:hover .step-arrow { color: var(--accent); transform: translateX(3px); }
    .step-num { font-size: 14px; font-weight: 700; color: var(--accent); }
    .step-body { flex: 1; display: grid; gap: 4px; }
    .step-body strong { font-size: 16px; }
    .step-body small { font-size: 13px; color: var(--ink-secondary); }
    .step-arrow { color: var(--ink-tertiary); transition: all 240ms var(--ease-out); }

    /* Bento & Product Cards */
    .bento-showcase { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
    .bento-span-7 { grid-column: span 7; }
    .bento-span-5 { grid-column: span 5; }
    .bento-span-4 { grid-column: span 4; }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .product-grid.wide-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .product-grid.is-list { grid-template-columns: 1fr; gap: 16px; }
    .product-card {
      display: flex; flex-direction: column; border-radius: var(--r-card);
      background: var(--bg-card); border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-sm); overflow: hidden;
      transition: transform 320ms var(--ease-out), box-shadow 360ms var(--ease-out), border-color 240ms var(--ease-apple);
    }
    .product-grid.is-list .product-card { flex-direction: row; align-items: stretch; }
    .product-grid.is-list .product-media-wrap { width: 300px; flex: none; }
    .product-grid.is-list .product-image { height: 100%; aspect-ratio: auto; min-height: 185px; }
    .product-card.is-bento { border-radius: var(--r-bento); }
    .product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--border-subtle); }
    :root[data-theme="dark"] .product-card:hover { border-color: rgba(10, 132, 255, 0.35); }
    .product-media-wrap { position: relative; overflow: hidden; background: var(--bg-gray); }
    .product-image { display: block; width: 100%; aspect-ratio: 16 / 10; padding: 0; border: 0; background: var(--bg-gray); overflow: hidden; }
    .product-card.is-bento .product-image { aspect-ratio: auto; height: 310px; }
    .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 480ms var(--ease-out); }
    .product-card:hover .product-image img { transform: scale(1.045); }
    .product-badge-row { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 6px; pointer-events: none; }
    .product-category { padding: 5px 12px; border-radius: var(--r-pill); background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); font-size: 12px; font-weight: 500; color: #1d1d1f; }
    .product-open-badge { padding: 5px 10px; border-radius: var(--r-pill); background: rgba(52, 199, 89, 0.22); backdrop-filter: blur(12px); border: 1px solid rgba(52, 199, 89, 0.34); font-size: 11px; font-weight: 600; color: #1c7c32; }
    .heart-btn {
      position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.06); background: rgba(255,255,255,0.88); backdrop-filter: blur(12px);
      color: #515154; display: grid; place-items: center; transition: all 220ms var(--ease-out);
    }
    .heart-btn:hover, .heart-btn.liked { color: var(--heart); background: #fff; transform: scale(1.08); }
    .card-hover-actions {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      opacity: 0; transform: translateY(6px); transition: opacity 220ms, transform 260ms var(--ease-out);
    }
    .product-card:hover .card-hover-actions, .card-hover-actions:focus-within { opacity: 1; transform: translateY(0); }
    .hover-pill {
      min-height: 32px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid rgba(255,255,255,0.28);
      background: rgba(29, 29, 31, 0.78); backdrop-filter: blur(12px); color: #fff; font-size: 12px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .hover-pill:hover, .hover-pill.is-active { background: var(--accent); border-color: var(--accent); }
    .product-info { flex: 1; padding: 20px 22px 22px; display: flex; flex-direction: column; }
    .product-title { margin: 0; padding: 0; border: 0; background: transparent; text-align: left; font-size: 19px; font-weight: 600; color: var(--ink-primary); letter-spacing: -0.02em; }
    .product-title:hover { color: var(--accent); }
    .product-excerpt { margin: 8px 0 0; font-size: 14px; color: var(--ink-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-creator { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-tertiary); }
    .product-creator-link { border: 0; background: transparent; padding: 0; color: var(--ink-secondary); font-weight: 500; }
    .product-creator-link:hover { color: var(--accent); }
    .product-bottom { margin-top: auto; padding-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .product-bottom b { font-size: 18px; letter-spacing: -0.02em; }
    .price-free { color: var(--success); }
    .product-open-link { border: 0; background: transparent; color: var(--accent); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
    .star-badge { display: inline-flex; align-items: center; gap: 3px; color: var(--amber); font-size: 12px; font-weight: 600; }

    /* Categories Bento */
    .category-bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
    .cat-bento-card {
      text-align: left; min-height: 196px; padding: 26px; border-radius: var(--r-bento);
      border: 1px solid var(--border-hairline); background: var(--bg-gray);
      display: flex; flex-direction: column; justify-content: space-between; transition: all 280ms var(--ease-out);
    }
    .cat-bento-card:hover { background: var(--bg-card); box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--border-subtle); }
    .cat-bento-top { display: flex; align-items: center; justify-content: space-between; }

    /* Spotlight & Closing */
    .asymmetric-7-5 { display: grid; grid-template-columns: 7fr 5fr; gap: 28px; }

    .spotlight-post-row p { margin: 0 0 8px; font-size: 14px; color: var(--ink-secondary); }

    .rank-index { font-size: 15px; font-weight: 700; color: var(--accent); width: 24px; }
    .creator-mini-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--ink-primary); color: var(--bg-white); display: grid; place-items: center; font-weight: 600; flex: none; }
    .spotlight-creator-info { flex: 1; display: grid; }

    .closing-center { text-align: center; max-width: 680px; margin: 0 auto; }

    /* Subpages */
    .subpage-shell { padding: calc(var(--nav-h) + 36px) 0 110px; background: var(--bg-gray); min-height: 84vh; animation: fadeUp 320ms var(--ease-out) both; }

    /* Market Sidebar Workspace */
    .market-desktop-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; align-items: start; }
    .market-sidebar {
      position: sticky; top: calc(var(--nav-h) + 24px); background: var(--bg-card);

      padding: 20px; display: grid; gap: 20px;
    }
    .sidebar-section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-tertiary); margin-bottom: 10px; }

    }
    .sidebar-cat-btn:hover { background: var(--bg-gray); color: var(--ink-primary); }

    .market-search-row { display: flex; gap: 10px; margin-bottom: 18px; align-items: center; }
    .market-search-box { flex: 1; min-height: 48px; padding: 0 16px; border-radius: var(--r-pill); background: var(--bg-card); border: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 10px; color: var(--ink-tertiary); }

    .sort-select { min-height: 48px; padding: 0 16px; border-radius: var(--r-pill); background: var(--bg-card); border: 1px solid var(--border-subtle); display: inline-flex; align-items: center; gap: 8px; color: var(--ink-secondary); }

    .view-toggle { display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: var(--bg-card); border: 1px solid var(--border-subtle); }

    .segmented-pills { display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: var(--bg-subtle); border: 1px solid var(--border-hairline); }

    .filter-toggle-chip { width: 100%; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-hairline); background: var(--bg-gray); color: var(--ink-secondary); font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; }
    .filter-toggle-chip.active { background: var(--accent-soft); border-color: rgba(0,122,255,0.35); color: var(--accent); font-weight: 600; }
    .results-line { display: flex; align-items: center; justify-content: space-between; margin: 0 0 18px; font-size: 14px; }

    /* Floating Compare Bar (Apple.com signature) */
    .compare-bar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 44;
      background: var(--bg-glass-strong); backdrop-filter: saturate(180%) blur(22px);

    /* Community, Detail, Shorts, Analytics */
    .community-desktop-layout { display: grid; grid-template-columns: minmax(0, 8fr) 340px; gap: 28px; align-items: start; }
    .community-aside { position: sticky; top: calc(var(--nav-h) + 24px); display: grid; gap: 18px; }
    .back-link { min-height: 40px; padding: 0 16px; margin-bottom: 20px; border-radius: var(--r-pill); border: 1px solid var(--border-hairline); background: var(--bg-card); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    .detail-layout { display: grid; grid-template-columns: 7fr 5fr; gap: 32px; align-items: start; }

    .short-play-overlay { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.45)); }
    .short-play-btn { width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); color: #1d1d1f; display: grid; place-items: center; box-shadow: var(--shadow-md); transition: transform 240ms; }

    .short-views { position: absolute; top: 12px; left: 12px; padding: 5px 11px; border-radius: var(--r-pill); background: rgba(0,0,0,0.56); backdrop-filter: blur(8px); color: #fff; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
    .short-body { padding: 20px; display: grid; gap: 10px; }

    .short-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

    .short-actions button.is-liked { color: var(--heart); background: rgba(255,45,85,0.1); border-color: rgba(255,45,85,0.24); }

    .community-compose { background: var(--bg-card); border-radius: var(--r-bento); padding: 24px; border: 1px solid var(--border-hairline); margin-bottom: 24px; display: grid; gap: 14px; }
    .community-compose textarea { width: 100%; min-height: 96px; padding: 14px; border-radius: 16px; border: 1px solid var(--border-subtle); background: var(--bg-gray); resize: vertical; outline: 0; }
    .community-post { background: var(--bg-card); border-radius: var(--r-card); padding: 22px; border: 1px solid var(--border-hairline); margin-bottom: 14px; display: grid; gap: 10px; }
    .post-comments { padding: 12px 14px; border-radius: 14px; background: var(--bg-gray); display: grid; gap: 6px; font-size: 13px; }
    .post-comment-box { display: flex; gap: 8px; }
    .post-comment-box input { flex: 1; min-height: 40px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--border-subtle); background: var(--bg-gray); outline: 0; }

    .analytics-grid { display: grid; grid-template-columns: 7fr 5fr; gap: 24px; }
    .sales-chart { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; align-items: end; height: 240px; padding-top: 24px; }
    .sales-col { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
    .sales-bar-wrap { width: 100%; max-width: 48px; flex: 1; background: var(--bg-gray); border-radius: 14px; display: flex; align-items: flex-end; overflow: hidden; }
    .sales-bar { width: 100%; background: linear-gradient(180deg, var(--accent), #5ac8fa); border-radius: 14px; transition: height 400ms var(--ease-out); }
    .top-prod-row { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--border-hairline); }
    .top-prod-row:last-child { border-bottom: 0; }
    .top-prod-bar { height: 6px; border-radius: 99px; background: var(--bg-gray); overflow: hidden; }
    .top-prod-fill { height: 100%; border-radius: 99px; background: var(--accent); }
    .split-ratio-bar { height: 12px; border-radius: 99px; background: var(--bg-subtle); overflow: hidden; display: flex; margin: 12px 0; }

    /* Slide-over Apple Drawers (Cart & DM) */
    .drawer-backdrop {
      position: fixed; inset: 0; z-index: 62; background: rgba(0, 0, 0, 0.36); backdrop-filter: blur(8px);
      display: flex; justify-content: flex-end;
    }
    .drawer-panel {
      width: min(440px, 100%); height: 100%; background: var(--bg-card); border-left: 1px solid var(--border-hairline);

      animation: slideInRight 280ms var(--ease-out) both;

    @keyframes slideInRight { from { transform: translateX(36px); opacity: 0.7; } to { transform: translateX(0); opacity: 1; } }

    .drawer-foot { border-top: 1px solid var(--border-hairline); padding-top: 16px; display: grid; gap: 12px; }
    .cart-item { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--bg-gray); }
    .cart-item img { width: 64px; height: 48px; object-fit: cover; border-radius: 10px; flex: none; }
    .chat-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; background: var(--bg-gray); }
    .chat-bubble.mine { justify-self: end; background: var(--accent); color: #fff; }

    /* Modals & Tour */
    .theater-stage { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 9; background: #000; margin-bottom: 16px; }

    .theater-hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.82)); color: #fff; display: grid; gap: 10px; }
    .theater-track { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.28); overflow: hidden; }
    .theater-fill { height: 100%; background: #fff; border-radius: 99px; transition: width 240ms linear; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.42); backdrop-filter: blur(10px); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
    .modal-box { width: min(640px, 100%); max-height: 90vh; overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border-hairline); border-radius: 26px; padding: 28px; box-shadow: var(--shadow-modal); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--border-hairline); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-secondary); }
    .form-grid input, .form-grid select, .form-grid textarea { width: 100%; min-height: 42px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border-subtle); background: var(--bg-gray); color: var(--ink-primary); outline: 0; }
    .full-field { grid-column: 1 / -1; }
    .modal-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
    .shortcut-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-hairline); font-size: 14px; }
    .shortcut-row:last-child { border-bottom: 0; }

    .command-panel { width: min(580px, 100%); background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-modal); }
    .command-search { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border-hairline); color: var(--ink-tertiary); }
    .command-search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink-primary); }
    .command-results { max-height: 360px; overflow-y: auto; padding: 10px; display: grid; gap: 4px; }
    .command-item { width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .command-item:hover { background: var(--bg-gray); }
    .command-item-left { display: inline-flex; align-items: center; gap: 10px; }
    .command-item-ic { width: 30px; height: 30px; border-radius: 9px; background: var(--bg-gray); color: var(--ink-secondary); display: grid; place-items: center; }

    .notice-floating {
      position: fixed; top: calc(var(--nav-h) + 14px); left: 50%; transform: translateX(-50%); z-index: 75;
      min-height: 44px; padding: 8px 14px 8px 16px; border-radius: var(--r-pill);
      background: rgba(29, 29, 31, 0.94); backdrop-filter: blur(14px); color: #fff; font-size: 14px;
      display: inline-flex; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,0.12);
    }
    .back-to-top-btn {
      position: fixed; right: 26px; bottom: 26px; z-index: 38; width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid var(--border-subtle); background: var(--bg-glass-strong); backdrop-filter: blur(16px);
      color: var(--ink-primary); box-shadow: var(--shadow-md); display: grid; place-items: center;
    }
    .apple-footer { background: var(--bg-gray); border-top: 1px solid var(--border-hairline); padding: 48px 0 40px; color: var(--ink-secondary); font-size: 13px; }
    .footer-bottom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-top: 20px; border-top: 1px solid var(--border-hairline); margin-top: 20px; }
    .footer-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-primary); font-weight: 700; }
    .mobile-quick-nav { display: none; }

    @media (max-width: 1120px) {
      .container, .nav-inner { padding-inline: 24px; }
      .market-desktop-layout, .community-desktop-layout { grid-template-columns: 1fr; }
      .market-sidebar, .community-aside { position: static; }
      .product-grid.wide-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bento-span-7, .bento-span-5, .bento-span-4 { grid-column: span 6; }
      .asymmetric-split, .asymmetric-7-5, .detail-layout, .analytics-grid { grid-template-columns: 1fr; }
      .detail-side { position: static; }
    }
    @media (max-width: 760px) {
      .container, .nav-inner { padding-inline: 16px; }
      .nav-links, .nav-publish-btn, .nav-search-label span, .desktop-only-btn, .view-toggle { display: none; }
      .nav-search-trigger { min-width: 40px; padding: 0 10px; justify-content: center; }
      .metrics-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bento-span-7, .bento-span-5, .bento-span-4 { grid-column: span 12; }
      .product-grid, .product-grid.wide-4, .shorts-grid, .form-grid { grid-template-columns: 1fr; }
      .product-grid.is-list .product-card { flex-direction: column; }
      .product-grid.is-list .product-media-wrap { width: 100%; }
      .market-search-row { flex-direction: column; align-items: stretch; }
      .compare-bar { bottom: 82px; }
      .mobile-quick-nav {
        position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 45;
        display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
        padding: 6px; border-radius: 22px; background: var(--bg-glass-strong);
        backdrop-filter: blur(20px); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-lg);
      }
      .mobile-quick-nav button { min-height: 44px; border: 0; background: transparent; color: var(--ink-secondary); font-size: 11px; display: grid; place-items: center; gap: 3px; }
      .mobile-quick-nav button.active { color: var(--accent); font-weight: 600; }
      .mobile-quick-nav .mobile-publish-fab { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; }
      .apple-footer { padding-bottom: 92px; }
      .back-to-top-btn { bottom: 80px; right: 14px; }
    }
  </style>

          html += `
            <div class="modal-backdrop" data-action="close-modals">
              <div class="modal-box" style="width:min(520px,100%)" data-stop="1">
                <div class="modal-head"><div><span class="eyebrow">SHORTS COMMENTS</span><h2>视频评论 (${s.comments.length})</h2></div><button class="icon-btn" data-action="close-modals">${ic('x', 18)}</button></div>
                <div style="display:grid;gap:10px;max-height:260px;overflow-y:auto;margin-bottom:14px">${s.comments.map(c => `<div style="padding:10px 14px;border-radius:12px;background:var(--bg-gray);font-size:14px"><b>社区创作者：</b>${esc(c)}</div>`).join('')}</div>
                <div class="post-comment-box"><input id="short-comment-input" placeholder="写下你对这条短视频的看法…" /><button class="btn-primary btn-sm" data-action="submit-short-comment" data-id="${esc(s.id)}">发送</button></div>
              </div>
            </div>
          `;
        }
      }

      return html;
    }

    function render() {
      const navItems = [['home', '发现'], ['market', '市场'], ['shorts', '短视频'], ['community', '社区'], ['leaderboard', '榜单'], ['analytics', '经营']];
      let content = '';
      if (state.page === 'home') content = renderHome();
      else if (state.page === 'market') content = renderMarket();
      else if (state.page === 'detail') content = renderDetail();
      else if (state.page === 'shorts') content = renderShorts();
      else if (state.page === 'community') content = renderCommunity();
      else if (state.page === 'leaderboard') content = renderLeaderboard();
      else if (state.page === 'creator') content = renderCreator();
      else if (state.page === 'profile') content = renderProfile();
      else if (state.page === 'analytics') content = renderAnalytics();

      document.getElementById('app').innerHTML = `
        <header class="apple-nav ${state.scrolled ? 'is-scrolled' : ''}">
          <div class="nav-inner">
            <button class="brand" data-nav="home">
              <span class="brand-mark">${ic('orbit', 18)}</span>
              <span class="brand-wordmark">AI CREATOR</span>
            </button>
            <nav class="nav-links">
              ${navItems.map(([id, label]) => `<button class="nav-link ${state.page === id ? 'is-active' : ''}" data-nav="${id}">${label}</button>`).join('')}
            </nav>
            <div class="nav-actions">
              <button class="icon-btn nav-search-trigger" data-action="open-cmd" title="全站快捷搜索 (⌘K 或 /)">
                <span class="nav-search-label">${ic('search', 15)}<span>搜索作品…</span></span>
                <kbd>⌘K</kbd>
              </button>
              <button class="icon-btn desktop-only-btn" data-action="open-shortcuts" title="电脑端快捷键 (?)" aria-label="快捷键指南">${ic('keyboard', 17)}</button>
              <button class="icon-btn" data-action="open-cart" title="购物袋 (B)" aria-label="购物袋">
                ${ic('bag', 17)}
                ${state.cart.length > 0 ? `<span class="dot-badge">${state.cart.length}</span>` : ''}
              </button>
              <button class="icon-btn" data-action="toggle-theme" title="切换深浅色外观 (D)" aria-label="切换浅色或深色模式">${ic(state.theme === 'dark' ? 'sun' : 'moon', 17)}</button>
              <button class="btn-primary btn-sm nav-publish-btn" data-action="open-publish">发布作品</button>
              <button class="avatar-trigger" data-nav="profile" title="个人创作中心" aria-label="个人创作中心">
                ${ic('user', 17)}
                ${state.favorites.length > 0 ? `<span class="dot-badge">${state.favorites.length}</span>` : ''}
              </button>
            </div>
          </div>
          <div id="nav-progress-bar" class="nav-progress"></div>
        </header>

        ${state.notice ? `<div class="notice-floating">${ic('check', 15)}<span>${esc(state.notice)}</span><button style="border:0;background:transparent;color:#fff;display:inline-flex" data-action="close-notice" aria-label="关闭">${ic('x', 15)}</button></div>` : ''}

        <main>${content}</main>

        <footer class="apple-footer">
          <div class="container">
            <div>AI CREATOR · 2026 Qoder 高校创造力大赛参赛作品。专注全球 AI 创作者作品展示、交流协作与 80% 高分成交易基础设施。</div>
            <div class="footer-bottom">
              <span class="footer-brand">${ic('orbit', 16)} AI CREATOR · Competition Edition v3.0</span>
              <span>按 <kbd>?</kbd> 查看电脑端快捷键 · Copyright © 2026 AI CREATOR</span>
            </div>
          </div>
        </footer>

        <nav class="mobile-quick-nav">
          <button class="${state.page === 'home' ? 'active' : ''}" data-nav="home">${ic('compass', 19)}<span>发现</span></button>
          <button class="${state.page === 'market' ? 'active' : ''}" data-nav="market">${ic('store', 19)}<span>市场</span></button>
          <button data-action="open-publish" aria-label="发布作品"><span class="mobile-publish-fab" style="display:grid;place-items:center">${ic('plus', 20)}</span></button>
          <button class="${state.page === 'community' ? 'active' : ''}" data-nav="community">${ic('message', 19)}<span>社区</span></button>
          <button class="${state.page === 'profile' ? 'active' : ''}" data-nav="profile">${ic('user', 19)}<span>我的</span></button>
        </nav>

        ${state.showTop ? `<button class="back-to-top-btn" data-action="back-top" aria-label="回到顶部">${ic('arrowUp', 18)}</button>` : ''}
        ${renderDrawersAndModals()}
      `;
      updateScrollBar();
      syncTheaterTimer();
    }

    function updateScrollBar() {
      const bar = document.getElementById('nav-progress-bar');
      if (!bar) return;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 0;
      bar.style.width = pct.toFixed(1) + '%';
    }

    function closeAllModals() {
      state.commandOpen = false; state.shortcutsOpen = false; state.publishOpen = false;
      state.deleteTargetId = null; state.boostShortId = null; state.shortCommentId = null;
      state.quickLookId = null; state.theaterShortId = null; state.compareOpen = false;
      state.cartOpen = false; state.dmCreator = null; state.tourOpen = false;
    }

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-nav], [data-action]');
      if (!el) return;
      if (el.dataset.action === 'close-modals' && e.target !== el && !el.classList.contains('icon-btn') && !el.classList.contains('btn-secondary') && !el.classList.contains('btn-primary')) return;

      const nav = el.dataset.nav;
      if (nav) { closeAllModals(); go(nav); return; }

      const act = el.dataset.action;
      if (act === 'toggle-theme') {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        showNotice(state.theme === 'dark' ? '已切换至深色外观' : '已切换至浅色外观');
      }
      else if (act === 'open-tour') { closeAllModals(); state.tourStep = 0; state.tourOpen = true; render(); }
      else if (act === 'next-tour') { state.tourStep = Math.min(3, state.tourStep + 1); render(); }
      else if (act === 'open-shortcuts') { closeAllModals(); state.shortcutsOpen = true; render(); }
      else if (act === 'open-cart') { closeAllModals(); state.cartOpen = true; render(); }
      else if (act === 'add-cart') addToCart(el.dataset.id, false);
      else if (act === 'buy-now') addToCart(el.dataset.id, true);
      else if (act === 'remove-cart') {
        state.cart = state.cart.filter(x => x !== el.dataset.id);
        writeLS('ac_web_cart_v3', state.cart);
        render();
      }
      else if (act === 'checkout-cart') {
        const cItems = state.cart.map(id => state.products.find(x => x.id === id)).filter(Boolean);
        if (!cItems.length) return;
        const total = cItems.reduce((s, p) => s + Number(p.price || 0), 0);
        const order = {
          orderNo: 'AC-' + String(Date.now()).slice(-6),
          titles: cItems.map(p => p.title),
          total,
          time: new Date().toLocaleString()
        };
        state.orders = [order, ...state.orders];
        state.cart = [];
        writeLS('ac_web_orders_v3', state.orders);
        writeLS('ac_web_cart_v3', state.cart);
        state.cartOpen = false;
        showNotice(`结算成功！订单 ${order.orderNo} 已同步至经营中心与个人订单`);
        go('analytics');
      }
      else if (act === 'toggle-compare') toggleCompare(el.dataset.id);
      else if (act === 'open-compare') { closeAllModals(); state.compareOpen = true; render(); }
      else if (act === 'clear-compare') { state.compareIds = []; render(); }
      else if (act === 'open-dm') { closeAllModals(); state.dmCreator = el.dataset.name; render(); }
      else if (act === 'set-rating') { state.reviewRating = Number(el.dataset.val); render(); }
      else if (act === 'scroll-eco') document.getElementById('ecosystem')?.scrollIntoView({ behavior: 'smooth' });
      else if (act === 'hide-quickstart') { state.quickStartVisible = false; render(); }
      else if (act === 'quick-look') { state.quickLookId = el.dataset.id; render(); }
      else if (act === 'open-product') { closeAllModals(); go('detail', el.dataset.id); }
      else if (act === 'open-creator') { closeAllModals(); go('creator', el.dataset.name); }
      else if (act === 'toggle-fav') toggleFavorite(el.dataset.id);
      else if (act === 'toggle-follow') toggleFollow(el.dataset.name);
      else if (act === 'filter-cat') { state.category = el.dataset.cat; state.marketSource = 'ALL'; go('market'); }
      else if (act === 'filter-opensource') { state.category = '全部'; state.marketSource = 'OPEN_SOURCE'; go('market'); }
      else if (act === 'set-cat') { state.category = el.dataset.cat; render(); }
      else if (act === 'set-mtype') { state.marketType = el.dataset.val; render(); }
      else if (act === 'set-mprice') { state.marketPrice = el.dataset.val; render(); }
      else if (act === 'set-mview') { state.marketView = el.dataset.val; render(); }
      else if (act === 'set-aperiod') { state.analyticsPeriod = el.dataset.val; render(); }
      else if (act === 'toggle-msrc') { state.marketSource = state.marketSource === 'OPEN_SOURCE' ? 'ALL' : 'OPEN_SOURCE'; render(); }
      else if (act === 'clear-market-q') { state.query = ''; render(); }
      else if (act === 'reset-market') { state.category = '全部'; state.marketType = 'ALL'; state.marketPrice = 'ALL'; state.marketSource = 'ALL'; state.query = ''; render(); }
      else if (act === 'open-collab') { state.communityMode = 'collab'; state.communityFilter = '合作招募'; go('community'); }
      else if (act === 'set-cmode') { state.communityMode = el.dataset.val; state.communityFilter = el.dataset.val === 'collab' ? '合作招募' : '全部'; render(); }
      else if (act === 'set-cfilter') { state.communityFilter = el.dataset.val; state.communityMode = el.dataset.val === '合作招募' ? 'collab' : 'feed'; render(); }
      else if (act === 'set-csort') { state.communitySort = el.dataset.val; render(); }
      else if (act === 'insert-prompt') { state.postDraft = (state.postDraft ? state.postDraft + '\n' : '') + el.dataset.text; render(); }
      else if (act === 'publish-post') {
        const text = state.postDraft.trim();
        if (!text) { showNotice('请先输入动态内容'); return; }
        state.posts = [{ id: 'post-' + Date.now(), author: 'Creator_001', tag: state.postTag, body: text, time: '刚刚', likes: 0, comments: [] }, ...state.posts];
        state.postDraft = '';
        writeLS('ac_web_posts_v3', state.posts);
        showNotice('动态已发布到社区');
      }
      else if (act === 'like-post') {
        const id = el.dataset.id;
        const liked = state.likedPosts.includes(id);
        state.likedPosts = liked ? state.likedPosts.filter(x => x !== id) : [...state.likedPosts, id];
        state.posts = state.posts.map(p => p.id === id ? { ...p, likes: Math.max(0, p.likes + (liked ? -1 : 1)) } : p);
        writeLS('ac_web_liked_posts_v3', state.likedPosts);
        writeLS('ac_web_posts_v3', state.posts);
        render();
      }
      else if (act === 'toggle-comment-box') { state.openCommentPostId = state.openCommentPostId === el.dataset.id ? null : el.dataset.id; render(); }
      else if (act === 'submit-comment') {
        const id = el.dataset.id;
        const input = document.getElementById('comment-input-' + id);
        const val = input ? input.value.trim() : '';
        if (!val) return;
        state.posts = state.posts.map(p => p.id === id ? { ...p, comments: [...p.comments, val] } : p);
        writeLS('ac_web_posts_v3', state.posts);
        state.openCommentPostId = null;
        showNotice('评论已发布');
      }
      else if (act === 'play-short') {
        const id = el.dataset.id;
        state.shorts = state.shorts.map(v => v.id === id ? { ...v, views: v.views + 1 } : v);
        writeLS('ac_web_shorts_v3', state.shorts);
        state.theaterShortId = id; state.theaterPlaying = true; state.theaterProgress = 12; render();
      }
      else if (act === 'toggle-theater-play') { state.theaterPlaying = !state.theaterPlaying; render(); }
      else if (act === 'like-short') {
        const id = el.dataset.id;
        state.shorts = state.shorts.map(v => v.id === id ? { ...v, liked: !v.liked, likes: v.likes + (v.liked ? -1 : 1) } : v);
        writeLS('ac_web_shorts_v3', state.shorts); render();
      }
      else if (act === 'open-short-comments') { state.theaterShortId = null; state.shortCommentId = el.dataset.id; render(); }
      else if (act === 'submit-short-comment') {
        const id = el.dataset.id;
        const input = document.getElementById('short-comment-input');
        const val = input ? input.value.trim() : '';
        if (!val) return;
        state.shorts = state.shorts.map(v => v.id === id ? { ...v, comments: [val, ...v.comments] } : v);
        writeLS('ac_web_shorts_v3', state.shorts); showNotice('短视频评论已发送');
      }
      else if (act === 'open-boost') { state.boostShortId = el.dataset.id; render(); }
      else if (act === 'submit-boost') { state.boostShortId = null; showNotice('推广预算预览已生成（不会真实扣款）'); }
      else if (act === 'open-cmd') { closeAllModals(); state.commandOpen = true; state.commandQuery = ''; render(); }
      else if (act === 'open-publish') { closeAllModals(); state.editingId = null; state.publishOpen = true; render(); }
      else if (act === 'edit-product') { closeAllModals(); state.editingId = el.dataset.id; state.publishOpen = true; render(); }
      else if (act === 'ask-delete') { state.deleteTargetId = el.dataset.id; render(); }
      else if (act === 'confirm-delete') {
        const id = el.dataset.id;
        state.products = state.products.filter(p => p.id !== id);
        writeLS('ac_web_products_v3', state.products);
        state.deleteTargetId = null; showNotice('作品已删除');
      }
      else if (act === 'share-product') {
        const url = `${location.origin}${location.pathname}#/detail/${el.dataset.id}`;
        try { navigator.clipboard?.writeText(url); } catch {}
        showNotice('作品分享链接已复制');
      }
      else if (act === 'close-modals') { closeAllModals(); render(); }
      else if (act === 'close-notice') { state.notice = ''; render(); }
      else if (act === 'back-top') window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'market-search-input') { state.query = t.value; render(); document.getElementById('market-search-input')?.focus(); }
      else if (t.id === 'shorts-search-input') { state.shortQuery = t.value; render(); document.getElementById('shorts-search-input')?.focus(); }
      else if (t.id === 'post-draft-input') { state.postDraft = t.value; }
      else if (t.id === 'cmd-input') { state.commandQuery = t.value; render(); document.getElementById('cmd-input')?.focus(); }
      else if (t.id === 'boost-budget-input') { state.boostBudget = t.value; render(); document.getElementById('boost-budget-input')?.focus(); }
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'market-sort-select') { state.sort = t.value; render(); }
      else if (t.id === 'post-tag-select') { state.postTag = t.value; }
    });

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'publish-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        const price = Math.max(0, Number(fd.get('price') || 0));
        const item = {
          id: state.editingId || 'u-' + Date.now(),
          title: String(fd.get('title') || '').trim(),
          category: String(fd.get('category') || 'AI 游戏'),
          creator: 'Creator_001',
          creatorBio: 'AI 创作者，持续探索创意边界。',
          price, rating: 5.0, reviews: [],
          description: String(fd.get('description') || '').trim(),
          image: ASSETS.p3, likes: 0, views: 1,
          createdAt: new Date().toISOString().slice(0, 10),
          license: String(fd.get('license') || '个人使用授权'),
          productType: String(fd.get('productType') || 'DIGITAL'),
          pricingModel: price === 0 ? 'FREE' : 'PAID',
          sourceAccess: String(fd.get('sourceAccess') || 'CLOSED_SOURCE')
        };
        state.products = state.editingId ? state.products.map(p => p.id === state.editingId ? { ...p, ...item } : p) : [item, ...state.products];
        writeLS('ac_web_products_v3', state.products);
        state.publishOpen = false; state.editingId = null;
        showNotice('作品已保存并发布到市场');
        go('profile');
      } else if (e.target.id === 'review-form') {
        e.preventDefault();
        const pid = e.target.dataset.id;
        const txt = String(new FormData(e.target).get('reviewText') || '').trim();
        if (!txt) return;
        const rev = { author: '评委 / 访客', rating: state.reviewRating, text: txt, time: '刚刚' };
        state.products = state.products.map(p => {
          if (p.id !== pid) return p;
          const nextRevs = [rev, ...(p.reviews || [])];
          const avg = nextRevs.reduce((s, r) => s + r.rating, 0) / nextRevs.length;
          return { ...p, reviews: nextRevs, rating: Number(avg.toFixed(1)) };
        });
        writeLS('ac_web_products_v3', state.products);
        showNotice('评价已发布并更新作品评分');
      } else if (e.target.id === 'dm-form' && state.dmCreator) {
        e.preventDefault();
        const txt = String(new FormData(e.target).get('dmText') || '').trim();
        if (!txt) return;
        const name = state.dmCreator;
        const prev = state.dmHistory[name] || [{ from: 'them', text: `你好！我是 ${name}，欢迎交流。`, time: '刚刚' }];
        state.dmHistory = {
          ...state.dmHistory,
          [name]: [
            ...prev,
            { from: 'me', text: txt, time: '刚刚' },
            { from: 'them', text: `收到你的消息！关于「${txt.slice(0, 16)}」，我稍后会整理详细交付方案与授权说明回复你。`, time: '自动回复' }
          ]
        };
        writeLS('ac_web_dm_v3', state.dmHistory);
        render();
      }
    });

    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
      const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); closeAllModals(); state.commandOpen = true; state.commandQuery = ''; render(); return;
      }
      if (e.key === 'Escape') { closeAllModals(); render(); return; }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '/') { e.preventDefault(); closeAllModals(); state.commandOpen = true; state.commandQuery = ''; render(); }
      else if (e.key === '?') { e.preventDefault(); const n = !state.shortcutsOpen; closeAllModals(); state.shortcutsOpen = n; render(); }
      else if (e.key.toLowerCase() === 'd') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); showNotice(state.theme === 'dark' ? '已切换至深色外观' : '已切换至浅色外观'); }
      else if (e.key.toLowerCase() === 'n') { closeAllModals(); state.editingId = null; state.publishOpen = true; render(); }
      else if (e.key.toLowerCase() === 'b') { closeAllModals(); state.cartOpen = true; render(); }
      else if (['1','2','3','4','5','6'].includes(e.key)) {
        const pages = ['home', 'market', 'shorts', 'community', 'leaderboard', 'analytics'];
        closeAllModals(); go(pages[Number(e.key) - 1]);
      }
    });

    window.addEventListener('scroll', () => {
      updateScrollBar();
      const s = window.scrollY > 16;
      const top = window.scrollY > 520;
      if (s !== state.scrolled || top !== state.showTop) { state.scrolled = s; state.showTop = top; render(); }
    }, { passive: true });

    render();
  </script>
</body>
</html>
